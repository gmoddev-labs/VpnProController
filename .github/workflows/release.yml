name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.2.0' }
          $Compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $Compiler)) { throw 'The Windows runner needs Inno Setup 6.7+.' }
          ./Build.ps1 -Installer -IsccPath $Compiler -Version $Version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VpnProController-Windows-x64
          path: |
            dist/*Setup-x64.exe
            dist/SHA256SUMS.txt
            dist/update.json
      - name: Publish private release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/*Setup-x64.exe dist/SHA256SUMS.txt dist/update.json --verify-tag --title "VPN Pro Controller $env:GITHUB_REF_NAME" --generate-notes
